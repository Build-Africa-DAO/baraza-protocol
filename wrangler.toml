name = "baraza-protocol"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "app/dist"

[vars]
STELLAR_NETWORK = "testnet"
STELLAR_HORIZON_URL = "https://horizon-testnet.stellar.org"
STELLAR_SOROBAN_RPC = "https://soroban-testnet.stellar.org"
VITE_SITE_URL = "https://barazaprotocol.com"

# FIFO Webhook Ingress Queue
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "baraza-webhook-ingress-queue"

# PostgreSQL Hyperdrive Connection Pooler
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "baraza-supabase-hyperdrive-id"

# Preview / Staging Environment Profile (Cloudflare Pages uses 'preview' for non-production branches)
[env.preview]
name = "baraza-protocol-staging"
[env.preview.assets]
directory = "app/dist"

[env.preview.vars]
STELLAR_NETWORK = "testnet"
STELLAR_HORIZON_URL = "https://horizon-testnet.stellar.org"
STELLAR_SOROBAN_RPC = "https://soroban-testnet.stellar.org"
VITE_SITE_URL = "https://staging.baraza-protocol.pages.dev"
ENVIRONMENT = "staging"

# Production Environment Profile
[env.production]
name = "baraza-protocol"
[env.production.assets]
directory = "app/dist"

[env.production.vars]
STELLAR_NETWORK = "public"
STELLAR_HORIZON_URL = "https://horizon.stellar.org"
STELLAR_SOROBAN_RPC = "https://soroban-rpc.mainnet.stellar.org"
VITE_SITE_URL = "https://barazaprotocol.com"
ENVIRONMENT = "production"

