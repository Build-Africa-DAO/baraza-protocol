<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baraza email templates</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A0A0A; color: #fff; }
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    aside { padding: 28px 18px; border-right: 1px solid #1f1f1f; }
    h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.03em; }
    .sub { margin: 0 0 22px; font-size: 12px; color: #A3A3A3; }
    .label { margin: 18px 0 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #F97316; }
    .nav-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #E5E5E5; padding: 10px 12px; margin: 0 0 4px; border-radius: 9999px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; }
    .nav-item:hover { background: #171717; }
    .nav-item.active { background: #F97316; color: #fff; }
    main { background: #F5F5F5; }
    iframe { width: 100%; height: 100vh; border: 0; background: #F5F5F5; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      iframe { height: calc(100vh - 220px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Baraza emails</h1>
      <p class="sub">13 templates. Black, white, orange</p>
      <p class="label">Auth</p><button type="button" class="nav-item active" data-src="./preview/signup-otp.html">Sign up code</button><button type="button" class="nav-item" data-src="./preview/signin-otp.html">Sign in code</button><button type="button" class="nav-item" data-src="./preview/signin-new-session.html">New sign in</button><button type="button" class="nav-item" data-src="./preview/account-welcome.html">Account created</button><p class="label">Notifications</p><button type="button" class="nav-item" data-src="./preview/vote-cast.html">Vote recorded</button><button type="button" class="nav-item" data-src="./preview/dues-reminder.html">Dues reminder</button><button type="button" class="nav-item" data-src="./preview/member-welcome.html">Membership active</button><button type="button" class="nav-item" data-src="./preview/proposal-created.html">New proposal</button><button type="button" class="nav-item" data-src="./preview/payment-confirmed.html">Payment confirmed</button><button type="button" class="nav-item" data-src="./preview/membership-activate.html">Activate membership</button><button type="button" class="nav-item" data-src="./preview/community-invite.html">Group invite</button><button type="button" class="nav-item" data-src="./preview/payout-approval.html">Payout needs approval</button><button type="button" class="nav-item" data-src="./preview/payout-settled.html">Payout settled</button>
    </aside>
    <main>
      <iframe id="frame" title="Email preview" src="./preview/signup-otp.html"></iframe>
    </main>
  </div>
  <script>
    const frame = document.getElementById('frame');
    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.src;
      });
    });
  </script>
</body>
</html>
