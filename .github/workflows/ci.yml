name: CI

on:
  push:
    branches: [main, dev, backend, backend-dev]
  pull_request:
    branches: [main, dev, backend, backend-dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-hygiene:
    name: Protocol & Git Hygiene Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protocol root dependencies
        run: npm install

      - name: Check vendored protocol artifacts
        run: npm run protocol:artifacts:check

      - name: Contract drift check
        run: npm run test:contracts:drift

      - name: Git Hygiene & Conflict Marker Verification
        run: |
          git diff --check
          echo "Scanning tracked files for unresolved merge conflict markers..."
          if git grep -n "^<<<<<<< "; then
            echo "ERROR: Unresolved conflict markers detected!"
            exit 1
          fi
          echo "Zero conflict markers verified."

      - name: Pre-flight Production Readiness Verification
        run: node scripts/validate-production-readiness.mjs

  static-analysis-and-security:
    name: Static Analysis & Security Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (Frontend & Node)
        run: npm run typecheck

      - name: Code Quality Lint
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Verify 100% Cloudflare Edge Router Route Coverage
        run: node ../scripts/devops/verify-edge-router.mjs

      - name: Transactional Database Migration DDL Check (Dry-Run)
        run: node ../scripts/devops/migrate-database.mjs --dry-run

  test:
    name: Database Integration & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Start PostgreSQL & PostgREST Stack
        run: |
          docker compose -f ../docker/docker-compose.yml up -d baraza-postgres baraza-postgrest baraza-gateway
          echo "Waiting for PostgREST on port 54321..."
          for i in {1..30}; do
            if curl -s http://localhost:54321/rest/v1/communities?select=count > /dev/null; then
              echo "PostgREST is healthy on port 54321!"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      - name: Run Full Vitest Suite (1,222 tests)
        run: npm test

  build:
    name: Build & Package Bundle
    runs-on: ubuntu-latest
    needs: [protocol-and-hygiene, static-analysis-and-security, test]
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA Bundle
        run: npm run build

      - name: Verify Cloudflare Pages Output Integrity
        run: |
          test -f dist/index.html
          test -f dist/_routes.json
          test -f dist/_headers
          test -f ../functions/api/\[\[catchall\]\].ts
          echo "Cloudflare Pages bundle and Functions edge router successfully verified."

      - name: Upload Verified Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baraza-dist
          path: app/dist
          retention-days: 7

  deploy-staging:
    name: Cloudflare Pages Staging Deployment
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/backend-dev') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download Verified Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: baraza-dist
          path: app/dist

      - name: Deploy Staging to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=baraza-protocol --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Cloudflare Pages Deployment
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download Verified Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: baraza-dist
          path: app/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=baraza-protocol --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
