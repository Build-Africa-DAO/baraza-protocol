<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Baraza | Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#9d4300",
                        "on-secondary": "#3c2f00",
                        "on-background": "#efe2c2",
                        "secondary": "#ffe083",
                        "on-primary-fixed-variant": "#783200",
                        "tertiary-fixed": "#ffdcc5",
                        "on-secondary-fixed-variant": "#574500",
                        "surface-tint": "#ffb690",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-tertiary": "#4f2500",
                        "surface-bright": "#403923",
                        "tertiary-container": "#e5812c",
                        "primary-fixed-dim": "#ffb690",
                        "primary-container": "#f97316",
                        "tertiary": "#ffb783",
                        "secondary-container": "#eec200",
                        "surface-container-low": "#211b08",
                        "primary": "#ffb690",
                        "background": "#181303",
                        "error": "#ffb4ab",
                        "surface-container": "#251f0b",
                        "secondary-fixed-dim": "#eec200",
                        "on-primary": "#552100",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "outline": "#a78b7d",
                        "surface-container-lowest": "#130e01",
                        "on-secondary-fixed": "#231b00",
                        "surface": "#181303",
                        "on-secondary-container": "#645000",
                        "on-error": "#690005",
                        "surface-variant": "#3b341f",
                        "inverse-surface": "#efe2c2",
                        "on-tertiary-container": "#522700",
                        "on-primary-fixed": "#341100",
                        "surface-container-high": "#302915",
                        "on-primary-container": "#582200",
                        "primary-fixed": "#ffdbca",
                        "outline-variant": "#584237",
                        "secondary-fixed": "#ffe083",
                        "on-tertiary-fixed": "#301400",
                        "on-tertiary-fixed-variant": "#713700",
                        "surface-container-highest": "#3b341f",
                        "inverse-on-surface": "#37301b",
                        "on-surface-variant": "#e0c0b1",
                        "surface-dim": "#181303",
                        "on-surface": "#efe2c2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-desktop": "64px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "stack-md": "24px",
                        "stack-lg": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Syne"],
                        "title-md": ["Syne"],
                        "body-md": ["DM Sans"],
                        "display-lg": ["Syne"],
                        "body-lg": ["DM Sans"],
                        "label-sm": ["DM Sans"],
                        "headline-lg": ["Syne"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "title-md": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],

                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .stagger-1 { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s; opacity: 0; }
        .stagger-2 { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s; opacity: 0; }
        .stagger-3 { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s; opacity: 0; }
        .stagger-4 { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s; opacity: 0; }
        
        .card-active { border-color: #ffb690 !important; background-color: #241B0A !important; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #0F0A00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background font-body-md min-h-screen flex flex-col">
<!-- Progress Header -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/80 backdrop-blur-md">
<div class="h-1.5 w-full bg-surface-container-low">
<div class="h-full bg-primary-container w-1/3 transition-all duration-700 ease-out"></div>
</div>
<nav class="flex justify-between items-center px-margin-mobile py-4 md:px-margin-desktop">
<div class="flex items-center gap-2">
<img alt="Baraza logo" class="h-8 w-8 shrink-0 rounded-lg" src="app/public/baraza-logo-v2.svg"/>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight"><span class="text-on-background">bara</span><span class="text-primary">za</span></span>
</div>
<button class="text-on-surface-variant font-label-sm uppercase tracking-widest hover:text-primary transition-colors">
                Skip
            </button>
</nav>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-24 pb-32 max-w-4xl mx-auto w-full">
<!-- Conversational Heading -->
<div class="text-center mb-stack-lg stagger-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-stack-sm text-on-background">
                What does your group do together?
            </h1>
<p class="text-on-surface-variant font-body-md max-w-md mx-auto">
                Tell us about your community’s focus so we can tailor your experience.
            </p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full">
<!-- Option 1 -->
<button class="stagger-1 text-left p-6 rounded-xl border border-[#2D2418] bg-[#1A1200] hover:border-primary transition-all group flex items-start gap-4 active:scale-[0.98]" onclick="toggleCard(this)">
<div class="p-3 rounded-lg bg-surface-container-high text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl">savings</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-1">Monthly Savings</h3>
<p class="text-on-surface-variant text-sm">Regular contributions and pooled funds for the group.</p>
</div>
</button>
<!-- Option 2 -->
<button class="stagger-2 text-left p-6 rounded-xl border border-[#2D2418] bg-[#1A1200] hover:border-primary transition-all group flex items-start gap-4 active:scale-[0.98]" onclick="toggleCard(this)">
<div class="p-3 rounded-lg bg-surface-container-high text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl">volunteer_activism</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-1">Community Service</h3>
<p class="text-on-surface-variant text-sm">Organizing events and social welfare initiatives.</p>
</div>
</button>
<!-- Option 3 -->
<button class="stagger-3 text-left p-6 rounded-xl border border-[#2D2418] bg-[#1A1200] hover:border-primary transition-all group flex items-start gap-4 active:scale-[0.98]" onclick="toggleCard(this)">
<div class="p-3 rounded-lg bg-surface-container-high text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl">celebration</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-1">Social Gathering</h3>
<p class="text-on-surface-variant text-sm">Events, meetups, and fostering personal connections.</p>
</div>
</button>
<!-- Option 4 -->
<button class="stagger-4 text-left p-6 rounded-xl border border-[#2D2418] bg-[#1A1200] hover:border-primary transition-all group flex items-start gap-4 active:scale-[0.98]" onclick="toggleCard(this)">
<div class="p-3 rounded-lg bg-surface-container-high text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-2xl">business_center</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface mb-1">Business Ventures</h3>
<p class="text-on-surface-variant text-sm">Joint investments and commercial group activities.</p>
</div>
</button>
</div>
</main>
<!-- Visual Anchor / Atmosphere -->
<div class="fixed bottom-0 left-0 w-full h-1/4 pointer-events-none overflow-hidden z-0">

</div>
<!-- Sticky Footer CTA -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile md:p-stack-lg z-10 bg-gradient-to-t from-background via-background/90 to-transparent">
<div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-gutter">
<p class="text-on-surface-variant font-body-md text-sm md:text-base text-center md:text-left">
                You can select multiple options that apply to your circle.
            </p>
<div class="flex items-center gap-4 w-full md:w-auto">
<button class="flex-1 md:flex-none px-8 py-4 rounded-full font-bold bg-[#2D2418] text-primary border border-transparent hover:border-primary transition-all active:scale-95">
                    Back
                </button>
<button class="flex-1 md:flex-none px-12 py-4 rounded-full font-bold bg-primary text-on-primary hover:brightness-110 shadow-lg shadow-primary/20 transition-all active:scale-95">
                    Continue
                </button>
</div>
</div>
</footer>
<script>
        function toggleCard(el) {
            el.classList.toggle('card-active');
            
            // Subtle haptic feel
            el.style.transform = 'scale(0.95)';
            setTimeout(() => {
                el.style.transform = '';
            }, 100);
        }

        // Initialize animations on load
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.grid button');
            options.forEach((opt, idx) => {
                opt.style.opacity = '0';
                opt.classList.add(`stagger-${idx + 1}`);
            });
        });
    </script>
</body></html>
